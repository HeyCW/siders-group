<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/siders-icon.png" />
    <title>Siders — Hyperlocal Media and Community</title>
    <meta
      name="description"
      content="Siders is a hyperlocal media and community platform connecting stories, brands, and people across Surabaya and Jakarta. Everyone has a voice, everyone has a story, everyone is Siders."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://sidersmedia.com/siders/" />

    <!-- Open Graph / social link previews — these read only this static index.html (crawlers here
         don't run JS), so this is the one place per-route titles/descriptions never reach; see
         src/lib/useDocumentTitle.ts for why that gap is accepted. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Siders" />
    <meta property="og:title" content="Siders — Hyperlocal Media and Community" />
    <meta
      property="og:description"
      content="Everyone has a voice. Everyone has a story. Everyone is Siders."
    />
    <meta property="og:url" content="https://sidersmedia.com/siders/" />
    <meta property="og:image" content="https://sidersmedia.com/siders/siders-icon.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Siders — Hyperlocal Media and Community" />
    <meta
      name="twitter:description"
      content="Everyone has a voice. Everyone has a story. Everyone is Siders."
    />
    <meta name="twitter:image" content="https://sidersmedia.com/siders/siders-icon.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Siders",
        "url": "https://sidersmedia.com/siders/",
        "logo": "https://sidersmedia.com/siders/siders-icon.png",
        "description": "Siders is a hyperlocal media and community platform connecting stories, brands, and people across Surabaya and Jakarta."
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Source Serif 4 (--font-serif) and Libre Franklin (--font-sans) — the weights this app
         actually uses (tailwind.config.ts's fontFamily comment), self-hosted no longer possible
         once next/font/google went with app/layout.tsx (making-csr), so fetched from Google's
         CDN via <link> the same way apps/admin already does. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;700;900&family=Libre+Franklin:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
