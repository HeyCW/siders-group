<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/siders/siders-icon.png" />
    <title>Siders — Hyperlocal Media and Community</title>
    <meta
      name="description"
      content="Siders is a hyperlocal media and community platform connecting stories, brands, and people across Surabaya and Jakarta. Everyone has a voice, everyone has a story, everyone is Siders."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://sidersmedia.com/siders/" />

    <!-- Open Graph / social link previews — these read only this static index.html (crawlers here
         don't run JS), so this is the one place per-route titles/descriptions never reach; see
         src/lib/useDocumentTitle.ts for why that gap is accepted. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Siders" />
    <meta property="og:title" content="Siders — Hyperlocal Media and Community" />
    <meta
      property="og:description"
      content="Everyone has a voice. Everyone has a story. Everyone is Siders."
    />
    <meta property="og:url" content="https://sidersmedia.com/siders/" />
    <meta property="og:image" content="https://sidersmedia.com/siders/siders-icon.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Siders — Hyperlocal Media and Community" />
    <meta
      name="twitter:description"
      content="Everyone has a voice. Everyone has a story. Everyone is Siders."
    />
    <meta name="twitter:image" content="https://sidersmedia.com/siders/siders-icon.png" />

    <!-- Entity graph for the Siders brand. Static (not React-injected) for the same reason as the
         Open Graph tags above: this file is what crawlers read before any JS runs.

         The point of the @graph is identity consolidation — one Organization node that the WebSite
         points at as its publisher, with `sameAs` listing every off-site profile Siders controls.
         That is what tells Google the IG/TikTok accounts and this domain are one brand, and that
         the domain is the canonical hub.

         The three anak usaha appear here only as `subOrganization` @id references. Each node is
         described in full on its own prerendered page (src/lib/seo.ts, scripts/prerender.mjs),
         under the same @id, so the two documents describe one entity rather than competing
         descriptions of it — and the detail sits on the page actually trying to rank for it.

         Social URLs are kept in sync with apps/api-laravel/database/seeders/AnakUsahaSeeder.php
         (the single source of truth for each brand's real links); tracking params are stripped
         because `sameAs` must be the canonical profile URL. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://sidersmedia.com/siders/#organization",
            "name": "Siders",
            "alternateName": "Siders Group",
            "legalName": "PT. Siders Karya Nusantara",
            "url": "https://sidersmedia.com/siders/",
            "logo": {
              "@type": "ImageObject",
              "@id": "https://sidersmedia.com/siders/#logo",
              "url": "https://sidersmedia.com/siders/siders-icon.png",
              "contentUrl": "https://sidersmedia.com/siders/siders-icon.png",
              "caption": "Siders"
            },
            "image": { "@id": "https://sidersmedia.com/siders/#logo" },
            "slogan": "Everyone has a voice. Everyone has a story. Everyone is Siders.",
            "description": "Siders is a hyperlocal media and community platform connecting stories, brands, and people across Surabaya and Jakarta.",
            "email": "karyasiders@gmail.com",
            "areaServed": [
              { "@type": "City", "name": "Surabaya" },
              { "@type": "City", "name": "Jakarta" }
            ],
            "address": {
              "@type": "PostalAddress",
              "addressCountry": "ID"
            },
            "contactPoint": [
              {
                "@type": "ContactPoint",
                "contactType": "customer support",
                "email": "karyasiders@gmail.com",
                "telephone": "+6281217371521",
                "availableLanguage": ["id", "en"]
              }
            ],
            "sameAs": [
              "https://www.instagram.com/sidersvox",
              "https://www.instagram.com/surabayasiders",
              "https://www.instagram.com/jakarta_siders",
              "https://www.tiktok.com/@surabaya.siders",
              "https://www.tiktok.com/@jakartasiders"
            ],
            "subOrganization": [
              { "@id": "https://sidersmedia.com/siders/#siders-vox" },
              { "@id": "https://sidersmedia.com/siders/#surabaya-siders" },
              { "@id": "https://sidersmedia.com/siders/#jakarta-siders" }
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://sidersmedia.com/siders/#website",
            "url": "https://sidersmedia.com/siders/",
            "name": "Siders",
            "description": "Siders is a hyperlocal media and community platform connecting stories, brands, and people across Surabaya and Jakarta.",
            "inLanguage": "id-ID",
            "publisher": { "@id": "https://sidersmedia.com/siders/#organization" }
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Source Serif 4 (--font-serif) and Libre Franklin (--font-sans) — the weights this app
         actually uses (tailwind.config.ts's fontFamily comment), self-hosted no longer possible
         once next/font/google went with app/layout.tsx (making-csr), so fetched from Google's
         CDN via <link> the same way apps/admin already does. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;700;900&family=Libre+Franklin:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/siders/assets/index-BqmVEklv.js"></script>
    <link rel="stylesheet" crossorigin href="/siders/assets/index-CFfBQA9k.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
