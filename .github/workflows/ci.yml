name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.5.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Start mock API (apps/web's `/` needs a reachable API to statically render at build time)
        run: |
          node apps/web/scripts/ci-mock-api.mjs &
          echo $! > /tmp/ci-mock-api.pid
          for i in $(seq 1 20); do
            curl -sf http://localhost:4310/home > /dev/null && exit 0
            sleep 0.5
          done
          echo "mock API never came up" >&2
          exit 1

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4310
        run: pnpm build

      - name: Stop mock API
        if: always()
        run: kill "$(cat /tmp/ci-mock-api.pid)" 2>/dev/null || true
