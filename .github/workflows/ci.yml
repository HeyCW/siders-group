name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Start mock API (apps/web's `/` needs a reachable API to statically render at build time)
        run: |
          node apps/web/scripts/ci-mock-api.mjs &
          echo $! > /tmp/ci-mock-api.pid
          for i in $(seq 1 20); do
            curl -sf http://localhost:4310/home > /dev/null && exit 0
            sleep 0.5
          done
          echo "mock API never came up" >&2
          exit 1

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4310
        run: npm run build

      - name: Stop mock API
        if: always()
        run: kill "$(cat /tmp/ci-mock-api.pid)" 2>/dev/null || true
