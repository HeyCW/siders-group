name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: siders
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.5.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # packages/contracts and packages/db resolve via their compiled `dist/` (package.json
      # `main`/`types`) as of the `fix: build process` commit — apps/web, apps/admin, and
      # apps/api's own typecheck all fail to resolve `@siders/contracts`/`@siders/db` without
      # this running first.
      - name: Build workspace packages
        run: |
          pnpm --filter @siders/contracts build
          pnpm --filter @siders/db build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate the CI MySQL database
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/siders
        run: pnpm --filter @siders/db db:migrate

      - name: Test
        env:
          # Enables apps/api/src/lib/mysqlIntegration.test.ts, which the rest of the suite
          # (built on in-memory fakes) can't stand in for — see that file's own comment and
          # openspec/changes/migrate-postgres-to-mysql/design.md's "Risks / trade-offs".
          RUN_DB_INTEGRATION_TESTS: '1'
          DATABASE_URL: mysql://root@127.0.0.1:3306/siders
        run: pnpm test

      # apps/web is a client-rendered SPA (making-csr) — the build no longer fetches anything at
      # build time, so unlike the old static-export design this doesn't need a reachable API
      # (mock or real) to succeed. VITE_API_URL is still supplied so the built bundle behaves
      # the way a real deploy's would, matching `apps/web/src/lib/env.ts`'s eager-fail check.
      - name: Build
        env:
          VITE_API_URL: http://localhost:4310
        run: pnpm build
